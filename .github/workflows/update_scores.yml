name: Calculate Scores

on:
  workflow_dispatch

permissions:
  contents: write

jobs:

  score:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas numpy

      - name: Calculate scores
        env:
          PYTHONPATH: .
        run: |
          python -m scripts.save_scores

      - name: Commit updated scores
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/scores/latest_score.json

          git diff --staged --quiet || git commit -m "Update latest_score.json"

          git push
