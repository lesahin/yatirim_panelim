name: Calculate Scores

on:
  workflow_dispatch

jobs:

  score:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas numpy

      - name: Calculate scores
        env:
          PYTHONPATH: .
        run: |
          python -m scripts.save_scores
