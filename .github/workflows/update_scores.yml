name: Calculate Scores

on:
  workflow_dispatch

jobs:

  score:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Calculate scores
        run: |
          PYTHONPATH=. python scripts/save_scores.py
