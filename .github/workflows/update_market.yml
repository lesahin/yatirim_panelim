- name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/*.csv

          git commit -m "update market data" || echo "No changes"

          git pull --rebase origin main

          git push origin main


          git add data/*.csv
          git commit -m "update market data" || echo "No changes"
        
